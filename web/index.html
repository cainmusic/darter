<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darter · Get Things Done</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 首屏前应用主题，避免切换主题后刷新出现闪烁（存储键与 src/theme.ts 一致）
      (function () {
        try {
          var t = localStorage.getItem('darter-theme')
          if (t && t !== 'cyber') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
